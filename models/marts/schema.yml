version: 2

models:
  - name: fct_matches
    description: "Match-level Gold mart containing outcomes, xG, set pieces, discipline, game-state shifts, Elo, and market handicap data."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_date
              - home_team
              - away_team
    columns:
      - name: match_date
        tests:
          - not_null
      - name: home_team
        tests:
          - not_null
      - name: away_team
        tests:
          - not_null

  - name: fct_team_match_performance
    description: "Team-match level Gold mart (two rows per match) with unpivoted tactical metrics, box penetration rates, xG efficiency, and Elo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - match_date
              - team_name
    columns:
      - name: match_date
        tests:
          - not_null
      - name: team_name
        tests:
          - not_null
      - name: venue
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away']